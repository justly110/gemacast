name: Build Android APK (arm64-v8a)

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'gemacast-core/**'
      - 'gemacast-mobile/**'
      - 'Cargo.toml'
      - 'version.txt'

jobs:
  build-apk:
    name: Build Android arm64-v8a APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Pinned NDK & Build Tools
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653" "cmake;3.22.1" "build-tools;34.0.0" "platforms;android-36"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV
          echo "BUILD_TOOLS_VERSION=34.0.0" >> $GITHUB_ENV

      - name: Resolve pinned Rust version
        id: rust
        shell: bash
        run: sed -n 's/^channel = "\(.*\)"/version=\1/p' rust-toolchain.toml >> "$GITHUB_OUTPUT"

      # 仅安装 aarch64-linux-android (arm64-v8a)
      - name: Setup Rust Mobile Targets
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.version }}
          targets: aarch64-linux-android

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libasound2-dev libxdo-dev clang

      - name: Force Reinstall cargo-ndk
        run: cargo install cargo-ndk --force

      - name: Install Frontend Dependencies
        working-directory: ./gemacast-mobile
        run: bun install --frozen-lockfile

      - name: Run Frontend Tests
        working-directory: ./gemacast-mobile
        run: bun test

      - name: Sync package.json and tauri.conf.json version with Cargo.toml
        working-directory: ./gemacast-mobile
        run: |
          VERSION=$(grep '^version = ' ../Cargo.toml | head -n 1 | cut -d '"' -f 2)
          echo "Syncing versions to v$VERSION"
          jq --arg v "$VERSION" '.version = $v' package.json > package.tmp.json && mv package.tmp.json package.json
          jq --arg v "$VERSION" '.version = $v' src-tauri/tauri.conf.json > src-tauri/tauri.conf.tmp && mv src-tauri/tauri.conf.tmp src-tauri/tauri.conf.json

      # 仅编译 arm64 架构
      - name: Build Unsigned APK via Tauri
        working-directory: ./gemacast-mobile
        run: |
          bunx tauri android build --apk --target aarch64

      # 签名证书必须逐次稳定，否则 Android 拒绝覆盖安装，用户每次升级都要卸载。
      # 缺 secret 或指纹不符一律硬失败，绝不回退到一次性生成的密钥。
      - name: Sign APK (pinned release keystore)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          EXPECTED_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          set -eu
          APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          APK_FILE=$(find gemacast-mobile/src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "Found APK: $APK_FILE"

          if [ -z "${KEYSTORE_BASE64:-}" ] || [ -z "${EXPECTED_CERT_SHA256:-}" ]; then
            echo "::error::安卓签名未配置：缺少 ANDROID_KEYSTORE_BASE64 或仓库变量 ANDROID_CERT_SHA256。"
            echo "::error::用一次性密钥签名会产出无法覆盖安装的 APK，因此这里直接失败。"
            echo "::error::本机执行一次 bash .github/scripts/setup-android-signing.sh 后重跑本工作流。"
            exit 1
          fi

          umask 077
          trap 'rm -f release.keystore' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > release.keystore

          # 口令只经管道进入 apksigner：不出现于 argv、不落盘、不回显。
          # 两行分别是 keystore 口令与私钥口令（PKCS#12 里二者相同）。
          printf '%s\n%s\n' "${KEYSTORE_PASS:-}" "${KEY_PASS:-${KEYSTORE_PASS:-}}" \
            | "$APKSIGNER" sign --ks release.keystore --ks-pass stdin \
                --ks-key-alias "${KEY_ALIAS:-gemacast}" \
                --key-pass stdin --out gemacast-mobile-arm64.apk "$APK_FILE"

          SIGNED_CERT=$("$APKSIGNER" verify --print-certs gemacast-mobile-arm64.apk \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr 'A-F' 'a-f')
          EXPECTED_CERT=$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ':' | tr 'A-F' 'a-f')
          echo "Signed certificate SHA-256: ${SIGNED_CERT:-<unreadable>}"
          echo "Pinned  certificate SHA-256: $EXPECTED_CERT"
          if [ "$SIGNED_CERT" != "$EXPECTED_CERT" ]; then
            echo "::error::签名证书与 ANDROID_CERT_SHA256 不符，已中止发布。"
            echo "::error::检查 ANDROID_KEYSTORE_BASE64 / ANDROID_KEY_ALIAS 是否指向那把固定密钥。"
            exit 1
          fi
          echo "Signature verified against the pinned certificate."

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gemacast-mobile-arm64
          path: gemacast-mobile-arm64.apk
          retention-days: 7

      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(cat version.txt | tr -d '[:space:]')
          TAG="v$VERSION"
          APK="gemacast-mobile-arm64.apk"
          SHA256=$(sha256sum "$APK" | cut -d' ' -f1)
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          echo "Preparing Release $TAG with APK $APK (sha256: $SHA256)"

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG does not exist. Creating..."
            gh release create "$TAG" --title "Gemacast $TAG" --notes "Release $TAG" --latest
          fi

          gh release upload "$TAG" "$APK" --clobber

          UPDATER_FILE="updater.json"
          if gh release download "$TAG" -p "$UPDATER_FILE" 2>/dev/null; then
            echo "Downloaded existing updater.json"
          else
            echo "Initializing new updater.json"
            echo '{"version":"'"$VERSION"'","pub_date":"'"$PUB_DATE"'","platforms":{}}' > "$UPDATER_FILE"
          fi

          ANDROID_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/${APK}"
          jq --arg ver "$VERSION" \
             --arg date "$PUB_DATE" \
             --arg url "$ANDROID_URL" \
             --arg hash "$SHA256" \
             '.version = $ver | .pub_date = $date | .platforms.android = { url: $url, signature: "", sha256: $hash }' \
             "$UPDATER_FILE" > updater.tmp.json && mv updater.tmp.json "$UPDATER_FILE"

          gh release upload "$TAG" "$UPDATER_FILE" --clobber
          echo "Successfully published APK and updater.json to release $TAG!"
