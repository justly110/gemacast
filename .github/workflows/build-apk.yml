name: Build Android APK (Manual)

on:
  workflow_dispatch: # 支持网页端手动一键触发
  push:
    branches: [main]
    paths:
      - 'gemacast-core/**'
      - 'gemacast-mobile/**'

jobs:
  build-apk:
    name: Build Android Universal APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 直接使用 GitHub Runner 内置的 Android SDK，绕过易崩溃的第三方 Action
      - name: Install Pinned NDK & Build Tools
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653" "cmake;3.22.1" "build-tools;34.0.0" "platforms;android-36"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV
          echo "BUILD_TOOLS_VERSION=34.0.0" >> $GITHUB_ENV

      - name: Resolve pinned Rust version
        id: rust
        shell: bash
        run: sed -n 's/^channel = "\(.*\)"/version=\1/p' rust-toolchain.toml >> "$GITHUB_OUTPUT"

      - name: Setup Rust Mobile Targets
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.version }}
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libasound2-dev libxdo-dev clang

      - name: Force Reinstall cargo-ndk
        run: cargo install cargo-ndk --force

      - name: Install Frontend Dependencies
        working-directory: ./gemacast-mobile
        run: bun install --frozen-lockfile

      - name: Sync package.json and tauri.conf.json version with Cargo.toml
        working-directory: ./gemacast-mobile
        run: |
          VERSION=$(grep '^version = ' ../Cargo.toml | head -n 1 | cut -d '"' -f 2)
          echo "Syncing versions to v$VERSION"
          jq --arg v "$VERSION" '.version = $v' package.json > package.tmp.json && mv package.tmp.json package.json
          jq --arg v "$VERSION" '.version = $v' src-tauri/tauri.conf.json > src-tauri/tauri.conf.tmp && mv src-tauri/tauri.conf.tmp src-tauri/tauri.conf.json

      - name: Build Unsigned APK via Tauri
        working-directory: ./gemacast-mobile
        run: |
          bunx tauri android build --apk

      # 生成临时签名密钥并自动给 APK 签名（手机安装必备，否则会提示解析包错误）
      - name: Sign APK with Debug Keystore
        run: |
          keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          
          # 寻找刚才打包生成的未签名 APK
          APK_FILE=$(find gemacast-mobile/src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "Found APK: $APK_FILE"
          
          # 对齐并签名
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android --out gemacast-mobile-signed.apk "$APK_FILE"
          echo "Signed successfully: gemacast-mobile-signed.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gemacast-mobile-signed
          path: gemacast-mobile-signed.apk
          retention-days: 7
