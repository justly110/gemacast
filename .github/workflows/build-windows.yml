name: Build Windows 64-bit Client

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'gemacast-core/**'
      - 'gemacast-pc/**'
      - 'wix/**'
      - 'Cargo.toml'
      - 'rust-toolchain.toml'
      - '.github/workflows/build-windows.yml'

jobs:
  build-windows:
    name: Build Windows x86_64 Client (EXE & MSI)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Resolve pinned Rust version
        id: rust
        shell: pwsh
        run: |
          $channel = (Get-Content rust-toolchain.toml | Select-String '^channel\s*=\s*"([^"]+)"').Matches.Groups[1].Value
          if (-not $channel) { $channel = "stable" }
          echo "version=$channel" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Resolved Rust toolchain version: $channel"

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.version }}
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build gemacast-pc (Release)
        shell: pwsh
        run: |
          cargo build --release -p gemacast-pc --target x86_64-pc-windows-msvc

      - name: Package Portable ZIP
        shell: pwsh
        run: |
          $portableDir = "gemacast-pc-portable"
          New-Item -ItemType Directory -Force -Path $portableDir | Out-Null
          
          # 复制主程序与 build.rs 自动下载解压的 ADB 依赖
          Copy-Item "target\x86_64-pc-windows-msvc\release\gemacast-pc.exe" "$portableDir\"
          Copy-Item "gemacast-pc\adb.exe" "$portableDir\"
          Copy-Item "gemacast-pc\AdbWinApi.dll" "$portableDir\"
          Copy-Item "gemacast-pc\AdbWinUsbApi.dll" "$portableDir\"
          
          Write-Host "Creating portable zip archive..."
          Compress-Archive -Path "$portableDir\*" -DestinationPath "gemacast-pc-x86_64-windows-portable.zip" -Force
          Write-Host "Portable zip packaged successfully."

      - name: Stage Binaries for WiX MSI
        shell: pwsh
        run: |
          $stagingDir = "wix\msi\staging"
          New-Item -ItemType Directory -Force -Path $stagingDir | Out-Null
          
          Copy-Item "target\x86_64-pc-windows-msvc\release\gemacast-pc.exe" "$stagingDir\"
          Copy-Item "gemacast-pc\adb.exe" "$stagingDir\"
          Copy-Item "gemacast-pc\AdbWinApi.dll" "$stagingDir\"
          Copy-Item "gemacast-pc\AdbWinUsbApi.dll" "$stagingDir\"
          
          Write-Host "Staging complete:"
          Get-ChildItem $stagingDir | Format-Table Name, Length

      - name: Build MSI Installer
        shell: pwsh
        run: |
          $version = if (Test-Path version.txt) { (Get-Content version.txt).Trim() } else { "6.6.6" }
          # MSI 规范仅支持三段纯数字 (如 6.6.6)
          $msiVersion = $version -replace '-.*$', ''
          
          $sourceDir = (Resolve-Path "wix\msi\staging").Path
          $iconDir = (Resolve-Path "wix\assets").Path
          
          Write-Host "Building MSI with Version=$msiVersion"
          dotnet build wix\msi\msi.wixproj `
            -c Release `
            "-p:Version=$msiVersion" `
            "-p:SourceDir=$sourceDir" `
            "-p:IconDir=$iconDir"
            
          $msi = Get-ChildItem -Path wix\msi\bin -Filter "*.msi" -Recurse | Select-Object -First 1
          if (-not $msi) {
            Write-Error "MSI was not generated!"
            exit 1
          }
          Copy-Item $msi.FullName -Destination "gemacast-pc-x86_64-windows-installer.msi"
          Write-Host "MSI generated successfully: gemacast-pc-x86_64-windows-installer.msi"

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gemacast-pc-windows-x64
          path: |
            gemacast-pc-x86_64-windows-portable.zip
            gemacast-pc-x86_64-windows-installer.msi
          retention-days: 7
