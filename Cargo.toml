[workspace]
resolver = "2"
members = ["gemacast-core", "gemacast-pc", "gemacast-mobile/src-tauri"]

[workspace.package]
version = "6.6.6"
edition = "2024"
authors = ["Echa Apriliyanto <echa.apriliyanto.dev@gmail.com>"]
license = "GPL-3.0-or-later"
homepage = "https://github.com/justly110/gemacast"
description = "gemacast汉化版"
repository = "https://github.com/justly110/gemacast"
keywords = ["audio", "streaming"]
categories = ["multimedia"]


[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.dev.package."*"]
opt-level = 3

[profile.dist]
inherits = "release"
lto = "thin"

[patch.crates-io]
audiopus_sys = { path = "vendor/audiopus_sys" }
